# Abreviaturas de color usadas en "Desc Producto" (maestro Alkosto) -> color normalizado.
# Archivo del primer alcance (iPhone), descartado: no se usa en la versión de televisores.
# Marcas: "confirmado" = validado con el equipo comercial; "inferido" = deducido de las descripciones y nunca
# validado, porque el alcance se descartó antes (ver docs/anexos/A2_viabilidad_televisores.md).
abreviaturas:
  Az: azul
  AzM: azul medianoche      # confirmado
  Azmd: azul medianoche     # inferido
  Pl: plata
  Ng: negro
  NgM: negro                # inferido (negro mate / medianoche)
  NgB: negro                # inferido (negro brillante)
  NgBr: negro               # inferido
  N: negro
  Nr: negro                 # confirmado por el equipo
  Na: naranja               # confirmado
  Bl: blanco
  B: blanco
  Bla: blanco
  Gr: gris
  Dr: dorado
  Or: oro
  Oro: oro
  Vr: verde
  Vd: verde                 # confirmado
  Rs: rosa
  RsDr: oro rosa            # inferido
  Mr: morado                # confirmado
  Mo: morado                # inferido
  Vt: violeta               # inferido (sugerido por el equipo)
  Rj: rojo
  Am: amarillo

# Palabras completas que aparecen en descripciones y títulos de las tiendas.
palabras:
  azul: azul
  ultramarino: azul
  medianoche: negro
  negro: negro
  black: negro
  blanco: blanco
  white: blanco
  plata: plata
  plateado: plata
  silver: plata
  gris: gris
  grafito: gris
  dorado: dorado
  oro: oro
  gold: oro
  verde: verde
  salvia: verde
  rosa: rosa
  rosado: rosa
  rojo: rojo
  red: rojo
  morado: morado
  purpura: morado
  lila: morado
  lavanda: morado
  amarillo: amarillo
  naranja: naranja
  borgona: borgoña
